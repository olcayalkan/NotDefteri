<svg xmlns="http://www.w3.org/2000/svg" width="480" height="214" viewBox="0 0 480 214" role="img" aria-label="Sayfalar arası bağ: Sayfaları birbirine bağla, tek tıkla geç."><title>Sayfalar arası bağ: Sayfaları birbirine bağla, tek tıkla geç.</title>
<style>
.anim { opacity: 0; }
@keyframes d0 {
  0.000% { opacity: 0; transform: translateX(8px); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
  10.667% { opacity: 0; transform: translateX(8px); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
  16.000% { opacity: 1; transform: translate(0, 0); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
  30.667% { opacity: 1; transform: translate(0, 0); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
  34.667% { opacity: 0; transform: translateX(-8px); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
  100.000% { opacity: 0; transform: translateX(-8px); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
}
.d0 { animation: d0 7.5s infinite; transform-box: fill-box; }
@keyframes d1 {
  0.000% { opacity: 0; transform: translateY(6px); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
  32.667% { opacity: 0; transform: translateY(6px); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
  38.000% { opacity: 1; transform: translate(0, 0); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
  88.533% { opacity: 1; transform: translate(0, 0); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
  92.533% { opacity: 0; transform: translateY(6px); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
  100.000% { opacity: 0; transform: translateY(6px); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
}
.d1 { animation: d1 7.5s infinite; transform-box: fill-box; }
@keyframes cizik {
  0.000% { transform: scaleX(0); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
  53.333% { transform: scaleX(0); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
  58.000% { transform: scaleX(1); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
  100.000% { transform: scaleX(1); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
}
.cizik { animation: cizik 7.5s infinite; transform-box: fill-box; transform-origin: left center; }
@media (prefers-reduced-motion: reduce) { .anim, .cizik { animation: none; opacity: 1; transform: none; } .d0 { display: none; } }
</style>
