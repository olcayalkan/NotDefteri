name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Linux]
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: "macOS 15.3 / Ubuntu 22.04"
  - type: input
    id: commit
    attributes:
      label: NotDefteri version or commit
      placeholder: "git rev-parse --short HEAD"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log / screenshot
      description: "On Linux, the newest .log file under ~/.local/state/NotDefteri/"
      render: text
