name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: platform
    attributes:
      label: Which platforms are affected?
      options:
        - label: macOS
        - label: Linux
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
