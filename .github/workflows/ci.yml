name: CI
run-name: "CI · ${{ github.event.pull_request.title || github.ref_name }}"

# Akış (her platform kendi zincirinde, iki platform paralel):
#
#   macOS · 1. Derle ─► macOS · 2. Test ─► macOS · 3. Paketle ─┐
#                                                              ├─► CI sonucu
#   Linux · 1. Derle ─► Linux · 2. Test ─► Linux · 3. Paketle ─┘
#
# Derlenmeyen kod test edilmez, testi geçmeyen kod paketlenmez.
# Derleyici uyarı/hataları ve kırık testler koşu sayfasında açıklama (annotation)
# olarak işaretlenir; her biri dosya ve satıra, oradan ilgili aşamaya götürür.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# İş akışı yalnızca kodu okur; yazma yetkisi gerekmiyor.
permissions:
  contents: read

# Aynı PR'a art arda push gelirse eski koşuyu iptal et; kuyruk boşa dolmasın.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Linux container'ında varsayılan kabuk sh; pipefail için bash gerekiyor.
defaults:
  run:
    shell: bash

jobs:
  # ─────────────────────────────── macOS ───────────────────────────────

  macos-derle:
    name: macOS · 1. Derle
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Araç zinciri bilgisi
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Paket bağımlılıklarını çöz
        run: swift package resolve

      - name: Uygulamayı derle (debug)
        run: |
          set -o pipefail
          swift build 2>&1 | tee -a derleme.log

      - name: Testleri derle
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee -a derleme.log

      - name: Hata ve uyarıları işaretle
        if: always()
        run: .github/scripts/bulgulari-isaretle.sh derleme.log "macOS · Derle"

      # Test işi aynı ikilileri kullansın, yeniden derlemesin.
      # tar: upload-artifact çalıştırma izinlerini ve symlink'leri korumuyor.
      - name: Derleme çıktısını paketle
        run: tar -czf derleme.tgz .build

      - name: Derleme çıktısını yükle
        uses: actions/upload-artifact@v7
        with:
          name: derleme-macos
          path: derleme.tgz
          retention-days: 1

  macos-test:
    name: macOS · 2. Test
    needs: macos-derle
    runs-on: macos-15
    # Takılan bir test (ör. modal uyarı) varsayılan 6 saatlik sınırı beklemesin.
    timeout-minutes: 15
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Derleme çıktısını indir
        uses: actions/download-artifact@v8
        with:
          name: derleme-macos

      - name: Derleme çıktısını aç
        run: tar -xzf derleme.tgz

      - name: Testleri çalıştır
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | tee test-sonucu.log

      - name: Test özeti
        if: always()
        run: .github/scripts/test-ozeti.sh test-sonucu.log "macOS (AppKit)"

      - name: Kırık testleri işaretle
        if: always()
        run: .github/scripts/bulgulari-isaretle.sh test-sonucu.log "macOS · Test"

      - name: Test günlüğünü yükle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-gunlugu-macos
          path: test-sonucu.log
          if-no-files-found: ignore

  macos-paketle:
    name: macOS · 3. Paketle
    needs: macos-test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Uygulamayı derle (release)
        run: swift build -c release

      - name: İkiliyi doğrula
        run: |
          file .build/release/NotDefteri
          ls -lh .build/release/NotDefteri

      - name: İkiliyi yükle
        uses: actions/upload-artifact@v7
        with:
          name: NotDefteri-macos
          path: .build/release/NotDefteri
          retention-days: 14

  # ─────────────────────────────── Linux ───────────────────────────────

  linux-derle:
    name: Linux · 1. Derle
    # Sabit sürüm: ubuntu-latest etiketi kendiliğinden yeni sürüme geçiyor.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.2-jammy
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Sistem paketlerini kur (GTK 4)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgtk-4-dev pkg-config

      - name: Araç zinciri bilgisi
        run: |
          grep PRETTY_NAME /etc/os-release
          echo "GTK $(pkg-config --modversion gtk4)"
          swift --version

      - name: Paket bağımlılıklarını çöz
        run: swift package resolve

      - name: Uygulamayı derle (debug)
        run: |
          set -o pipefail
          swift build 2>&1 | tee -a derleme.log

      - name: Testleri derle
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee -a derleme.log

      - name: Hata ve uyarıları işaretle
        if: always()
        run: .github/scripts/bulgulari-isaretle.sh derleme.log "Linux · Derle"

      - name: Derleme çıktısını paketle
        run: tar -czf derleme.tgz .build

      - name: Derleme çıktısını yükle
        uses: actions/upload-artifact@v7
        with:
          name: derleme-linux
          path: derleme.tgz
          retention-days: 1

  linux-test:
    name: Linux · 2. Test
    needs: linux-derle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.2-jammy
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      # Manifest gtk4'ü pkg-config ile arıyor; test ikilisi de GTK'ya bağlı olabilir.
      - name: Sistem paketlerini kur (GTK 4)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgtk-4-dev pkg-config

      - name: Derleme çıktısını indir
        uses: actions/download-artifact@v8
        with:
          name: derleme-linux

      - name: Derleme çıktısını aç
        run: tar -xzf derleme.tgz

      - name: Testleri çalıştır
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | tee test-sonucu.log

      - name: Test özeti
        if: always()
        run: .github/scripts/test-ozeti.sh test-sonucu.log "Linux (GTK 4)"

      - name: Kırık testleri işaretle
        if: always()
        run: .github/scripts/bulgulari-isaretle.sh test-sonucu.log "Linux · Test"

      - name: Test günlüğünü yükle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-gunlugu-linux
          path: test-sonucu.log
          if-no-files-found: ignore

  linux-paketle:
    name: Linux · 3. Paketle
    needs: linux-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.2-jammy
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Sistem paketlerini kur (GTK 4)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgtk-4-dev pkg-config file

      - name: Uygulamayı derle (release)
        run: swift build -c release

      - name: İkiliyi doğrula
        run: |
          file .build/release/NotDefteri
          ls -lh .build/release/NotDefteri

      - name: İkiliyi yükle
        uses: actions/upload-artifact@v7
        with:
          name: NotDefteri-linux
          path: .build/release/NotDefteri
          retention-days: 14

  # ─────────────────────────────── Sonuç ───────────────────────────────

  # Branch protection'da tek kontrol yeterli olsun; aşama eklense de kural değişmez.
  sonuc:
    name: CI sonucu
    if: always()
    needs: [macos-derle, macos-test, macos-paketle, linux-derle, linux-test, linux-paketle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Tüm aşamalar geçti mi?
        env:
          SONUCLAR: ${{ toJSON(needs) }}
        run: |
          {
            echo "### CI sonucu"
            echo "| Aşama | Sonuç |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$SONUCLAR"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success")' <<< "$SONUCLAR" > /dev/null
