name: CI
run-name: "CI · ${{ github.event.pull_request.title || github.ref_name }}"

# Flow (each platform has its own chain; both platforms run in parallel):
#
#   macOS · 1. Build ─► macOS · 2. Test ─► macOS · 3. Package ─┐
#                                                              ├─► CI result
#   Linux · 1. Build ─► Linux · 2. Test ─► Linux · 3. Package ─┘
#
# Code that does not build is not tested; code that fails tests is not packaged.
# Compiler warnings/errors and failing tests are marked as annotations on the run
# page; each one links to its file and line, and from there to its stage.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only reads the code; no write permission is needed.
permissions:
  contents: read

# Cancel the previous run when a PR gets a new push, so the queue does not fill up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The default shell in the Linux container is sh; pipefail needs bash.
defaults:
  run:
    shell: bash

jobs:
  # ─────────────────────────────── macOS ───────────────────────────────

  macos-build:
    name: macOS · 1. Build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Build app (debug)
        run: |
          set -o pipefail
          swift build 2>&1 | tee -a build.log

      - name: Build tests
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee -a build.log

      - name: Annotate errors and warnings
        if: always()
        run: .github/scripts/annotate-findings.sh build.log "macOS · Build"

      # The test job reuses the same binaries instead of rebuilding.
      # tar: upload-artifact does not keep execute permissions or symlinks.
      - name: Pack build output
        run: tar -czf build.tgz .build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-macos
          path: build.tgz
          retention-days: 1

  macos-test:
    name: macOS · 2. Test
    needs: macos-build
    runs-on: macos-15
    # A hanging test (e.g. a modal alert) must not wait for the default 6-hour limit.
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-macos

      - name: Unpack build output
        run: tar -xzf build.tgz

      - name: Run tests
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | tee test-results.log

      - name: Test summary
        if: always()
        run: .github/scripts/test-summary.sh test-results.log "macOS (AppKit)"

      - name: Annotate failing tests
        if: always()
        run: .github/scripts/annotate-findings.sh test-results.log "macOS · Test"

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-macos
          path: test-results.log
          if-no-files-found: ignore

  macos-package:
    name: macOS · 3. Package
    needs: macos-test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build app (release)
        run: swift build -c release

      - name: Verify binary
        run: |
          file .build/release/NotDefteri
          ls -lh .build/release/NotDefteri

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: NotDefteri-macos
          path: .build/release/NotDefteri
          retention-days: 14

  # ─────────────────────────────── Linux ───────────────────────────────

  linux-build:
    name: Linux · 1. Build
    # Pinned version: the ubuntu-latest label moves to new releases on its own.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.2-jammy
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install system packages (GTK 4)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgtk-4-dev pkg-config

      - name: Toolchain info
        run: |
          grep PRETTY_NAME /etc/os-release
          echo "GTK $(pkg-config --modversion gtk4)"
          swift --version

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Build app (debug)
        run: |
          set -o pipefail
          swift build 2>&1 | tee -a build.log

      - name: Build tests
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee -a build.log

      - name: Annotate errors and warnings
        if: always()
        run: .github/scripts/annotate-findings.sh build.log "Linux · Build"

      - name: Pack build output
        run: tar -czf build.tgz .build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-linux
          path: build.tgz
          retention-days: 1

  linux-test:
    name: Linux · 2. Test
    needs: linux-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.2-jammy
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # The manifest looks up gtk4 via pkg-config; the test binary may link GTK too.
      - name: Install system packages (GTK 4)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgtk-4-dev pkg-config

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-linux

      - name: Unpack build output
        run: tar -xzf build.tgz

      - name: Run tests
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | tee test-results.log

      - name: Test summary
        if: always()
        run: .github/scripts/test-summary.sh test-results.log "Linux (GTK 4)"

      - name: Annotate failing tests
        if: always()
        run: .github/scripts/annotate-findings.sh test-results.log "Linux · Test"

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-linux
          path: test-results.log
          if-no-files-found: ignore

  linux-package:
    name: Linux · 3. Package
    needs: linux-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.2-jammy
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install system packages (GTK 4)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgtk-4-dev pkg-config file

      - name: Build app (release)
        run: swift build -c release

      - name: Verify binary
        run: |
          file .build/release/NotDefteri
          ls -lh .build/release/NotDefteri

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: NotDefteri-linux
          path: .build/release/NotDefteri
          retention-days: 14

  # ─────────────────────────────── Result ───────────────────────────────

  # A single check is enough for branch protection; adding stages does not change the rule.
  result:
    name: CI result
    if: always()
    needs: [macos-build, macos-test, macos-package, linux-build, linux-test, linux-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Did all stages pass?
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### CI result"
            echo "| Stage | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null
