name: CodeQL
run-name: "CodeQL · ${{ github.ref_name }}"

# Code scanning: Swift sources and workflows are scanned for vulnerabilities.
# Results appear under Security → Code scanning.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # Every Monday, so new queries also run on unchanged code.
  workflow_dispatch:

permissions:
  contents: read

# Only PR runs are cancelled: a cancelled main run reports a configuration error.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: CodeQL · ${{ matrix.lang }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write   # Only to upload results.
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: swift      # Swift is analyzed by building on macOS.
            runner: macos-15
            build: manual
          - lang: actions    # Workflow files; no build needed.
            runner: ubuntu-24.04
            build: none
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.lang }}
          build-mode: ${{ matrix.build }}
          queries: security-and-quality

      - name: Build
        if: matrix.build == 'manual'
        run: swift build

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.lang }}"
