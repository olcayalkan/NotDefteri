name: CodeQL
run-name: "CodeQL · ${{ github.ref_name }}"

# Code scanning: Swift sources and workflows are scanned for vulnerabilities.
# Results appear under Security → Code scanning.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # Every Monday, so new queries also run on unchanged code.
  workflow_dispatch:

permissions:
  contents: read

# Only PR runs are cancelled: a cancelled main run reports a configuration error.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CodeQL analyzes Swift only on macOS runners. swift-macos covers the core, AppKit and
  # executable targets and their tests; swift-gtk builds the GTK app target on macOS with
  # Homebrew GTK 4 (NOTDEFTERI_GTK=1 in Package.swift) so it is scanned too.
  scan:
    name: CodeQL · ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write   # Only to upload results.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: swift-macos
            category: /language:swift
            lang: swift
            runner: macos-15
            build: manual
            command: swift build --build-tests
          - name: swift-gtk
            category: /language:swift-gtk
            lang: swift
            runner: macos-15
            build: manual
            gtk: true
            # Compile only the GTK app module: it is not linked or run on macOS. The GTK
            # tests use Linux-only GLib declarations; they run in the Linux CI job instead.
            command: swift build --target NotDefteriLinux
          - name: actions      # Workflow files; no build needed.
            category: /language:actions
            lang: actions
            runner: ubuntu-24.04
            build: none
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install GTK 4 (Homebrew)
        if: matrix.gtk
        run: brew install gtk4 pkg-config

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.lang }}
          build-mode: ${{ matrix.build }}
          queries: security-and-quality

      - name: Build
        if: matrix.build == 'manual'
        env:
          NOTDEFTERI_GTK: ${{ matrix.gtk && '1' || '' }}
        run: ${{ matrix.command }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: ${{ matrix.category }}
          output: sarif-results

      # Lists the findings on the run page and in the job log, so they are visible
      # without opening the Security tab.
      - name: Findings summary
        if: always()
        run: .github/scripts/codeql-summary.sh sarif-results "CodeQL · ${{ matrix.name }}"
